<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="incense-seal-tray-title incense-seal-tray-description"><title id="incense-seal-tray-title">香篆静室</title><desc id="incense-seal-tray-description">香事 / 铜绿与灰白。香灰实体面与篆香形线有轻重，铜炉置于漆盘，非香法复原。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
