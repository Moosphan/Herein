<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="windlass-stone-well-title windlass-stone-well-description"><title id="windlass-stone-well-title">井台汲古</title><desc id="windlass-stone-well-description">辘轳 / 木轴与青石。木架承轴、绳从卷筒入井，井壁为实体，旁置水桶，装饰性构造意象。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
