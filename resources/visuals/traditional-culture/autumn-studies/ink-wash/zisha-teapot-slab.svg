<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="zisha-teapot-slab-title zisha-teapot-slab-description"><title id="zisha-teapot-slab-title">紫砂陈韵</title><desc id="zisha-teapot-slab-description">紫砂 / 栗褐与茶青。壶身、盖、流和把以陶色转面表现厚度，壶口与流口真实开合。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
