<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bronze-pan-iron-silk-title bronze-pan-iron-silk-description"><title id="bronze-pan-iron-silk-title">铜熨展帛</title><desc id="bronze-pan-iron-silk-description">百工 / 古铜与绛帛。长柄铜熨斗以深盘容炭，柄接盘后壁，器底贴近丝帛，通用器形意象。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
