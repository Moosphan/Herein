<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="suspended-bronze-gong-title suspended-bronze-gong-description"><title id="suspended-bronze-gong-title">铜锣悬响</title><desc id="suspended-bronze-gong-description">礼乐 / 铜金与深木。圆锣有收边与中央鼓面，双绳接梁，框架落脚，槌头有包裹层。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
