<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="windlass-well-bucket-title windlass-well-bucket-description"><title id="windlass-well-bucket-title">辘轳井畔</title><desc id="windlass-well-bucket-description">乡居 / 木赭与石青。双柱托卷筒与轴，曲柄接近端轴头，绳垂入井口，木桶置井沿。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
