<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="celadon-pillow-title celadon-pillow-description"><title id="celadon-pillow-title">瓷枕清梦</title><desc id="celadon-pillow-description">瓷枕 / 豆形与卷草。枕面微凹、器壁与底缘连续，青瓷面内绘花枝，不以通透代替釉色。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
