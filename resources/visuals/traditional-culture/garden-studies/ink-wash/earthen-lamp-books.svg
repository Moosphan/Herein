<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="earthen-lamp-books-title earthen-lamp-books-description"><title id="earthen-lamp-books-title">陶灯书影</title><desc id="earthen-lamp-books-description">灯火 / 陶盏与书册。灯盘、灯柱与底座相接，灯芯伸出油盘边缘，书页与封面有厚度。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
