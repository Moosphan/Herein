<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="hairpins-comb-title hairpins-comb-description"><title id="hairpins-comb-title">簪梳凝香</title><desc id="hairpins-comb-description">梳篦 / 玉簪与金花。木梳疏齿与两支簪体交错，珠坠有挂接，花头和长针保持连接。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
