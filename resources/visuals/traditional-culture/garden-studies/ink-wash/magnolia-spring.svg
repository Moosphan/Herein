<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="magnolia-spring-title magnolia-spring-description"><title id="magnolia-spring-title">辛夷照春</title><desc id="magnolia-spring-description">木兰 / 粉白与虬枝。大瓣木兰沿枝向舒展，实体浅瓣与透明花间留白分开。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
