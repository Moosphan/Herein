<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="magpies-plum-title magpies-plum-description"><title id="magpies-plum-title">双鹊报春</title><desc id="magpies-plum-description">喜鹊 / 长尾与梅枝。两鹊改变俯仰与体量，黑白翼面、蓝灰长尾及扣枝足爪明确。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
<filter id="magpies-plum-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
