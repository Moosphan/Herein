<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="persimmon-autumn-title persimmon-autumn-description"><title id="persimmon-autumn-title">柿染秋枝</title><desc id="persimmon-autumn-description">秋果 / 橙赭与枯叶。柿果的萼、果柄和承重枝连续，橙红果面保留同色转暗。。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
