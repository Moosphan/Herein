<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="chen-ping-counsel-title chen-ping-counsel-description"><title id="chen-ping-counsel-title">陈平 · 运筹</title><desc id="chen-ping-counsel-description">楚汉汉初 / 从容筹策。据长美色方向设计高长体态与丰润椭圆面骨，短髭、侧折巾冠；青碧宽袖配金赭内襟，无披风，收袖议事。五官和服色属原创推演。原创代码彩墨，非可证实的本人肖像。透明背景；依据见 historical-references.md。</desc><defs>
