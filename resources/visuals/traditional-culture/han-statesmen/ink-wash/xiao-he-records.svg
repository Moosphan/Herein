<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="xiao-he-records-title xiao-he-records-description"><title id="xiao-he-records-title">萧何 · 掌籍</title><desc id="xiao-he-records-description">西汉初 / 图籍与政务。侧身坐姿、长鼻凹颊与分束灰髯，低折冠；熟褐宽袖配麻色曲裾，俯手整理图籍。与旧人物分别起稿，五官服色属艺术推演。原创代码彩墨，非可证实的本人肖像。透明背景；依据见 historical-references.md。</desc><defs>
