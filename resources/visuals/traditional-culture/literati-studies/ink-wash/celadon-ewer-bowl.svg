<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="celadon-ewer-bowl-title celadon-ewer-bowl-description"><title id="celadon-ewer-bowl-title">青瓷注碗</title><desc id="celadon-ewer-bowl-description">注子 / 青釉与茶色。注子置温碗内，以釉色、曲柄、流口与茶盏表现器物关系，非特定出土器复原。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
