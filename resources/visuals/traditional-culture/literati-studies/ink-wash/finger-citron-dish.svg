<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="finger-citron-dish-title finger-citron-dish-description"><title id="finger-citron-dish-title">佛手清供</title><desc id="finger-citron-dish-description">佛手 / 金黄与青釉。果体连续分出卷曲指状裂瓣，以黄赭转面和青瓷浅盘体现清供。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
