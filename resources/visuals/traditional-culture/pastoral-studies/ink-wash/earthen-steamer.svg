<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="earthen-steamer-title earthen-steamer-description"><title id="earthen-steamer-title">陶甑炊烟</title><desc id="earthen-steamer-description">炊器 / 陶赭与淡汽。上甑下釜叠置，耳与器壁连接，甑底孔和石支承表现装饰性炊蒸意象。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
