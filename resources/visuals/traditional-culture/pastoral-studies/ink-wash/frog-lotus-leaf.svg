<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="frog-lotus-leaf-title frog-lotus-leaf-description"><title id="frog-lotus-leaf-title">荷钱听蛙</title><desc id="frog-lotus-leaf-description">青蛙 / 褶腿与荷叶。低伏青蛙以鼓眼、短前足和折叠后腿表现体积，荷叶承接足部。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
