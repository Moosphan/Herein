<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bronze-yi-basin-title bronze-yi-basin-description"><title id="bronze-yi-basin-title">铜匜沃盥</title><desc id="bronze-yi-basin-description">铜匜 / 古铜与青锈。浅腹长流、后鋬、三足及连续内腔，原创礼器形态练习，非具名文物复原。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
