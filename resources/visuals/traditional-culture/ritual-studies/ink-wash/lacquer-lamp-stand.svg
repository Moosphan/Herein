<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="lacquer-lamp-stand-title lacquer-lamp-stand-description"><title id="lacquer-lamp-stand-title">灯檠书影</title><desc id="lacquer-lamp-stand-description">灯檠 / 朱漆与微金。灯盘接立柱、立柱落座，灯芯与火焰位于油盘一侧，书册另置下方。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
