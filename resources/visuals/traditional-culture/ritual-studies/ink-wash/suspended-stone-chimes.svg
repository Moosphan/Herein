<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="suspended-stone-chimes-title suspended-stone-chimes-description"><title id="suspended-stone-chimes-title">磬石悬声</title><desc id="suspended-stone-chimes-description">编磬意象 / 石青与朱木。折角磬石悬在木架横梁下，绳接穿孔，简化四磬不充当历史编列或声学复原。原创代码彩墨意象，非文物、古迹、技术或物种复原。透明背景。</desc><defs>
