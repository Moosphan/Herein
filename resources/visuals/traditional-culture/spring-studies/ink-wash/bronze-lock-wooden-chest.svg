<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bronze-lock-wooden-chest-title bronze-lock-wooden-chest-description"><title id="bronze-lock-wooden-chest-title">铜锁守匣</title><desc id="bronze-lock-wooden-chest-description">箱匣 / 木赭与铜金。箱盖箱壁共用投影，锁扣连盖壁，横锁梁贯穿扣环，非开锁机制图。原创代码彩墨意象，非具名文物、工艺或物种复原。透明背景。</desc><defs>
