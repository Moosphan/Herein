<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="lacquer-tray-peaches-title lacquer-tray-peaches-description"><title id="lacquer-tray-peaches-title">漆盘荐果</title><desc id="lacquer-tray-peaches-description">漆木 / 朱漆与桃粉。漆盘内底、口沿、前壁共用椭圆投影，桃实以缝线、尖顶和柔色面建立体积。原创代码彩墨意象，非具名文物、工艺或物种复原。透明背景。</desc><defs>
