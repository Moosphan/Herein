<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="bamboo-brush-pot-title bamboo-brush-pot-description"><title id="bamboo-brush-pot-title">笔筒清供</title><desc id="bamboo-brush-pot-description">文房 / 竹黄与墨色。笔杆插入有内壁的竹筒，笔毫聚束收锋，前筒壁遮住插入部分。原创代码彩墨意象，非文物、古迹或技术复原。透明背景。</desc><defs>
